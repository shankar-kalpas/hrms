version: "3.8" # Updated version
services:
  mariadb:
    image: mariadb:10.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed # Temporary fix for MariaDB 10.6
    environment:
      MYSQL_ROOT_PASSWORD: 123
    volumes:
      - mariadb-data:/var/lib/mysql

  redis:
    image: redis:alpine

  frappe:
    image: frappe/bench:v5.27.0
    command: bash /workspace/init.sh
    environment:
      - SHELL=/bin/bash
    working_dir: /home/frappe
    volumes:
      - .:/workspace
    # ports:
    #   - 8000:8000
    #   - 9000:9000

    networks:
      - web # Connect to the external network for Traefik access
      - vivid-internal # Connect to the internal network for DB/Redis access
    labels:
      # Enable Traefik for this service
      - "traefik.enable=true"
      - "traefik.http.routers.hrms-frappe.rule=Host(`frappe.edalytics.com`)"
      - "traefik.http.routers.hrms-frappe.entrypoints=websecure"
      - "traefik.http.routers.hrms-frappe.tls.certresolver=lets-encrypt"
      - "traefik.http.services.hrms-frappe.loadbalancer.server.port=80"


volumes:
  mariadb-data:


networks:
  web:
    external: true
  internal:
    external: false
